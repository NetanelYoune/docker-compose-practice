services:
  frontend:
    image: netanelyihune/frontend:v1
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - app-network

  backend:
    image: netanelyihune/backend:v2
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - app-network

  mongo:
    image: mongo:latest
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:

volumes:
  mongo-data:
